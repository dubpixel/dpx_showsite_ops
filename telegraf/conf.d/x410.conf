# ControlByWeb X-410 Relay Controller - SNMP Integration
# Monitors 4 digital inputs and 4 relay outputs
# Device IP: Configured via X410_IP env variable (dpx-x410.local hostname via docker-compose)
# SNMP Community: Configured via X410_SNMP_COMMUNITY (default: public for both read and write)
# Enterprise OID Base: 1.3.6.1.4.1.30586.46.0

[[inputs.snmp]]
  agents = ["dpx-x410.local:161"]
  version = 2
  community = "${X410_SNMP_COMMUNITY}"
  interval = "30s"
  timeout = "5s"
  retries = 3
  agent_host_tag = "source"
  
  # Digital Inputs (read-only) - 4 inputs
  # Values: "0" = inactive, "1" = active (STRING type per MIB)
  [[inputs.snmp.field]]
    name = "digital_input_1"
    oid = "1.3.6.1.4.1.30586.46.0.1"
  
  [[inputs.snmp.field]]
    name = "digital_input_2"
    oid = "1.3.6.1.4.1.30586.46.0.2"
  
  [[inputs.snmp.field]]
    name = "digital_input_3"
    oid = "1.3.6.1.4.1.30586.46.0.3"
  
  [[inputs.snmp.field]]
    name = "digital_input_4"
    oid = "1.3.6.1.4.1.30586.46.0.4"
  
  # Relay Outputs (read/write) - 4 relays
  # Values: "0" = off, "1" = on (STRING type per MIB, not INTEGER)
  [[inputs.snmp.field]]
    name = "relay_1"
    oid = "1.3.6.1.4.1.30586.46.0.5"
  
  [[inputs.snmp.field]]
    name = "relay_2"
    oid = "1.3.6.1.4.1.30586.46.0.6"
  
  [[inputs.snmp.field]]
    name = "relay_3"
    oid = "1.3.6.1.4.1.30586.46.0.7"
  
  [[inputs.snmp.field]]
    name = "relay_4"
    oid = "1.3.6.1.4.1.30586.46.0.8"
  
  # Vin (power supply voltage)
  # Value is in millivolts / 1000 (e.g., 12345 = 12.345V)
  [[inputs.snmp.field]]
    name = "vin"
    oid = "1.3.6.1.4.1.30586.46.0.9"

# Processor to convert string relay values to integers for easier querying
[[processors.converter]]
  namepass = ["snmp"]
  [processors.converter.fields]
    integer = ["digital_input_1", "digital_input_2", "digital_input_3", "digital_input_4", "relay_1", "relay_2", "relay_3", "relay_4"]

# Tag with device type for easier filtering
[[processors.override]]
  namepass = ["snmp"]
  [processors.override.tags]
    device_type = "x410_relay_controller"
