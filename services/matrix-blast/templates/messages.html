<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recent Blasts</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      padding: 2rem;
      width: 100%;
      max-width: 520px;
    }

    .page-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.75rem;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ffdc00;
    }

    .back-link {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: #555;
      text-decoration: none;
      text-transform: uppercase;
    }
    .back-link:hover { color: #999; }

    #feed { }

    .msg-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid #222;
    }
    .msg-row:last-child { border-bottom: none; }

    .msg-swatch {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      flex-shrink: 0;
      border: 1px solid #333;
    }

    .msg-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .msg-text {
      font-size: 0.95rem;
      color: #e0e0e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .msg-meta {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .msg-badge {
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffdc00;
      border: 1px solid #444;
      border-radius: 2px;
      padding: 0.1rem 0.35rem;
    }

    .msg-sign {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #555;
    }

    .msg-time {
      font-size: 0.7rem;
      color: #555;
      flex-shrink: 0;
      text-align: right;
      min-width: 4.5rem;
    }

    .msg-empty {
      color: #444;
      font-size: 0.85rem;
      text-align: center;
      padding: 2rem 0;
    }

    .pulse {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #333;
      margin-left: 0.4rem;
      vertical-align: middle;
      animation: pulse 5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 90% { background: #333; }
      95%      { background: #ffdc00; }
      100%     { background: #333; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="page-header">
      <h1>&#9654; Recent Blasts <span class="pulse" title="Refreshes every 5s"></span></h1>
      <a href="/" class="back-link">&#9664; Blast</a>
    </div>

    {% include "messages_feed.html" %}
  </div>
</body>
</html>
