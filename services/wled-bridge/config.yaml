# ================================================================================
# WLED BRIDGE - ZONE CONFIGURATION
# ================================================================================
# Defines pixel zones on the WLED ropelight and what data source drives each zone.
#
# Pixel map (100px ropelight — px 0 reserved as system fake LED):
#   px  0       →  (reserved — system fake LED, never touched)
#   px  1– 12  →  btn_blue    Button status (12px)
#   px 13– 24  →  btn_green   Button status (12px)
#   px 25– 36  →  btn_orange  Button status / yellow lamp (12px)
#   px 37– 48  →  btn_red     Button status (12px)
#   px 49– 62  →  tent_temp   Tent temperature (14px)
#   px 63– 75  →  foh_temp    FOH temperature (13px)
#   px 76– 99  →  dark        Unused — forced black on startup (static)
#
# Source types:
#   mqtt_temperature  — subscribes to BLE decoder temp topics, filters by room
#   mqtt_state        — subscribes to a single topic, shows color_on or color_off
#
# Env vars in ${VAR} format are expanded at startup.
# ================================================================================

wled:
  # Full MQTT base topic — must match WLED Config → Sync Interfaces → MQTT → Device topic
  # WLED subscribes to: {device_topic}/api for JSON segment commands
  device_topic: "${WLED_DEVICE_TOPIC}"
  led_count: 100


zones:

  # ── Button Status Zones (pixels 100–147) ────────────────────────────────────
  # Driven by dpx-guest-alert-button service via MQTT.
  # Topics: {SHOWSITE}/button/{color}/state  →  "on" or "off"
  # Lamp colors from config: relay 1=RED, 2=YELLOW, 3=GREEN, 4=BLUE

  - id: btn_blue
    segment_id: 0
    name: "Blue Button Status"
    pixels:
      start: 1
      stop: 13      # exclusive — 12px
    source:
      type: mqtt_state
      topic: "${SHOWSITE_NAME}/button/blue/state"
    color_on:  [0, 100, 255]
    color_off: [0, 0, 0]

  - id: btn_green
    segment_id: 1
    name: "Green Button Status"
    pixels:
      start: 13
      stop: 25
    source:
      type: mqtt_state
      topic: "${SHOWSITE_NAME}/button/green/state"
    color_on:  [0, 200, 0]
    color_off: [0, 0, 0]

  - id: btn_orange
    segment_id: 2
    name: "Orange/Yellow Button Status"
    pixels:
      start: 25
      stop: 37
    source:
      type: mqtt_state
      topic: "${SHOWSITE_NAME}/button/yellow/state"
    color_on:  [255, 120, 0]
    color_off: [0, 0, 0]

  - id: btn_red
    segment_id: 3
    name: "Red Button Status"
    pixels:
      start: 37
      stop: 49
    source:
      type: mqtt_state
      topic: "${SHOWSITE_NAME}/button/red/state"
    color_on:  [255, 0, 0]
    color_off: [0, 0, 0]


  # ── Temperature Zones (pixels 49–75) ────────────────────────────────────────

  - id: tent_temp
    segment_id: 4
    name: "Tent Temperature"
    pixels:
      start: 49
      stop: 63      # exclusive — 14px
    source:
      type: mqtt_temperature
      room: "${TENT_SENSOR_ROOM}"
    gradient:
      - { temp_f: 60, rgb: [  0,  50, 255] }   # Blue   — cold
      - { temp_f: 65, rgb: [  0, 200, 200] }   # Cyan
      - { temp_f: 72, rgb: [  0, 200,   0] }   # Green  — comfortable
      - { temp_f: 78, rgb: [220, 220,   0] }   # Yellow — warm
      - { temp_f: 85, rgb: [255, 100,   0] }   # Orange — hot
      - { temp_f: 92, rgb: [255,   0,   0] }   # Red    — danger

  - id: foh_temp
    segment_id: 5
    name: "FOH Temperature"
    pixels:
      start: 63
      stop: 76      # exclusive — 13px
    source:
      type: mqtt_temperature
      room: "${FOH_SENSOR_ROOM}"
    gradient:
      - { temp_f: 60, rgb: [  0,  50, 255] }
      - { temp_f: 65, rgb: [  0, 200, 200] }
      - { temp_f: 72, rgb: [  0, 200,   0] }
      - { temp_f: 78, rgb: [220, 220,   0] }
      - { temp_f: 85, rgb: [255, 100,   0] }
      - { temp_f: 92, rgb: [255,   0,   0] }


  # ── Dark segment — forced black on startup (px 76–99) ───────────────────────

  - id: dark
    segment_id: 6
    name: "Unused LEDs (dark)"
    pixels:
      start: 76
      stop: 100     # exclusive — covers rest of strip
    source:
      type: static
    color: [0, 0, 0]
